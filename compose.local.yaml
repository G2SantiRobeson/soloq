services:
  db:
    image: postgres:17-alpine
    container_name: soloq-postgres
    restart: unless-stopped
    env_file:
      - .env.postgres.local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - soloq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soloq -d soloq"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  soloq-postgres-data:
